<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-CRM — point de départ</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    #pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: .5rem; }
    section { background: #f3f3f3; padding: .5rem; border-radius: 6px; }
    article { background: #fff; margin: .3rem 0; padding: .3rem; border-radius: 4px; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Mini-CRM</h1>
  <label>Connecté en tant que : <select id="utilisateur"></select></label>
  <div id="pipeline"></div>
  <div id="tableau-de-bord" hidden>
    <h2>Tableau de bord</h2>
    <p>Pipeline en cours : <b id="total"></b></p>
    <p>Par étape : <code id="par-etape"></code></p>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
