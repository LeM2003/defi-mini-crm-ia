<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-CRM — Orbus Digital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <h1>Mini-CRM</h1>
    <label>Connecté en tant que : <select id="utilisateur"></select></label>
    <p id="erreur" role="alert"></p>
    <div id="pipeline"></div>
    <div id="tableau-de-bord" hidden>
      <h2>Tableau de bord</h2>
      <p>Pipeline en cours : <b id="total"></b></p>
      <p>Par étape :</p>
      <ul id="par-etape"></ul>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
